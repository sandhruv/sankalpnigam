<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SangamRAG - conflict-aware retrieval augmented generation system">
  <defs>
    <linearGradient id="ragBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131313" />
      <stop offset="1" stop-color="#2c2119" />
    </linearGradient>
    <linearGradient id="ragAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d" />
      <stop offset="1" stop-color="#ca8a04" />
    </linearGradient>
    <radialGradient id="ragGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.38" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="ragDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#ragBg)" />
  <rect width="1200" height="630" fill="url(#ragDots)" />
  <circle cx="880" cy="230" r="270" fill="url(#ragGlow)" />

  <!-- documents -->
  <g>
    <rect x="592" y="96" width="150" height="196" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16" />
    <rect x="614" y="126" width="106" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.22" />
    <rect x="614" y="148" width="86" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.22" />
    <rect x="614" y="170" width="106" height="9" rx="4.5" fill="#fbbf24" fill-opacity="0.7" />
    <rect x="614" y="192" width="72" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.22" />
    <rect x="614" y="214" width="98" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.22" />
    <rect x="614" y="236" width="64" height="9" rx="4.5" fill="#ef4444" fill-opacity="0.75" />
  </g>

  <!-- vector index nodes -->
  <g stroke="#fbbf24" stroke-opacity="0.5" stroke-width="3">
    <line x1="742" y1="150" x2="856" y2="118" />
    <line x1="742" y1="150" x2="846" y2="238" />
    <line x1="856" y1="118" x2="962" y2="176" />
    <line x1="846" y1="238" x2="962" y2="176" />
    <line x1="846" y1="238" x2="938" y2="300" />
    <line x1="962" y1="176" x2="938" y2="300" />
    <line x1="742" y1="150" x2="846" y2="238" />
  </g>

  <g>
    <circle cx="742" cy="150" r="22" fill="url(#ragAmber)" />
    <circle cx="856" cy="118" r="16" fill="#fbbf24" fill-opacity="0.85" />
    <circle cx="846" cy="238" r="16" fill="#fbbf24" fill-opacity="0.85" />
    <circle cx="962" cy="176" r="16" fill="#fbbf24" fill-opacity="0.85" />
    <circle cx="938" cy="300" r="16" fill="#fbbf24" fill-opacity="0.85" />
  </g>

  <!-- conflict flag -->
  <g>
    <rect x="964" y="238" width="132" height="46" rx="23" fill="#131313" fill-opacity="0.8" stroke="#ef4444" stroke-opacity="0.85" stroke-width="2" />
    <circle cx="990" cy="261" r="7" fill="#ef4444" />
    <text x="1008" y="269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffd7d7">CONFLICT</text>
  </g>

  <!-- answer bubble -->
  <g>
    <rect x="676" y="322" width="268" height="74" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16" />
    <rect x="700" y="346" width="180" height="10" rx="5" fill="#fbbf24" fill-opacity="0.75" />
    <rect x="700" y="368" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.22" />
  </g>

  <!-- bottom band -->
  <rect x="0" y="404" width="1200" height="226" fill="#0c0c0c" fill-opacity="0.55" />
  <rect x="0" y="404" width="1200" height="2" fill="#ca8a04" fill-opacity="0.55" />

  <rect x="72" y="440" width="64" height="4" rx="2" fill="#ca8a04" />
  <text x="72" y="486" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="6" fill="#fbbf24">RETRIEVAL-AUGMENTED GENERATION</text>
  <text x="72" y="548" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#ffffff">SangamRAG</text>
  <text x="72" y="590" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#cfc9c0">FAISS vector search with conflict detection before generation</text>
</svg>
