<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Vettora - AI recruitment and assessment platform">
  <defs>
    <linearGradient id="vetBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131313" />
      <stop offset="1" stop-color="#2b2417" />
    </linearGradient>
    <linearGradient id="vetAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d" />
      <stop offset="1" stop-color="#ca8a04" />
    </linearGradient>
    <radialGradient id="vetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.38" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="vetDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#vetBg)" />
  <rect width="1200" height="630" fill="url(#vetDots)" />
  <circle cx="900" cy="220" r="270" fill="url(#vetGlow)" />

  <!-- resume card -->
  <g>
    <rect x="778" y="70" width="252" height="308" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18" />
    <circle cx="828" cy="126" r="26" fill="url(#vetAmber)" />
    <rect x="872" y="112" width="120" height="12" rx="6" fill="#fbbf24" fill-opacity="0.85" />
    <rect x="872" y="136" width="84" height="10" rx="5" fill="#ffffff" fill-opacity="0.24" />
    <rect x="806" y="184" width="196" height="10" rx="5" fill="#ffffff" fill-opacity="0.18" />
    <rect x="806" y="208" width="160" height="10" rx="5" fill="#ffffff" fill-opacity="0.18" />
    <rect x="806" y="232" width="184" height="10" rx="5" fill="#ffffff" fill-opacity="0.18" />
    <rect x="806" y="272" width="132" height="10" rx="5" fill="#fbbf24" fill-opacity="0.6" />
    <rect x="806" y="296" width="176" height="10" rx="5" fill="#ffffff" fill-opacity="0.14" />
    <rect x="806" y="320" width="148" height="10" rx="5" fill="#ffffff" fill-opacity="0.14" />
    <!-- scan line -->
    <rect x="778" y="252" width="252" height="4" fill="url(#vetAmber)" />
    <rect x="778" y="248" width="252" height="12" fill="#fbbf24" fill-opacity="0.12" />
  </g>

  <!-- score badges -->
  <g>
    <rect x="672" y="150" width="86" height="40" rx="20" fill="#131313" fill-opacity="0.75" stroke="#ca8a04" stroke-opacity="0.7" />
    <text x="715" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fbbf24">92%</text>
    <rect x="672" y="206" width="86" height="40" rx="20" fill="#131313" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="715" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e8e4dc">ATS</text>
  </g>

  <!-- check marks -->
  <g stroke="url(#vetAmber)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M1046 148 l16 16 30 -34" />
    <path d="M1046 216 l16 16 30 -34" />
    <path d="M1046 284 l16 16 30 -34" />
  </g>

  <!-- bottom band -->
  <rect x="0" y="404" width="1200" height="226" fill="#0c0c0c" fill-opacity="0.55" />
  <rect x="0" y="404" width="1200" height="2" fill="#ca8a04" fill-opacity="0.55" />

  <rect x="72" y="440" width="64" height="4" rx="2" fill="#ca8a04" />
  <text x="72" y="486" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="6" fill="#fbbf24">RECRUITMENT PLATFORM</text>
  <text x="72" y="548" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Vettora</text>
  <text x="72" y="590" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#cfc9c0">62 REST APIs, 4 AI features, 11-type anti-cheat proctoring</text>
</svg>
